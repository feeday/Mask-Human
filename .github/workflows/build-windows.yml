name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '使用说明.txt']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      NUMBA_DISABLE_JIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test EXE
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mask-Human-Windows-x64
          path: dist/Mask-Human.exe
          if-no-files-found: error
          retention-days: 30
